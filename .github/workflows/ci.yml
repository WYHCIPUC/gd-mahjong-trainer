name: ci
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: 单元测试（快速套件）
        run: npm test
      - run: npm run build
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e 2>&1 | tee /tmp/e2e.log; exit ${PIPESTATUS[0]}
      - name: E2E 失败摘要
        if: failure()
        run: |
          echo '## E2E 输出（末 60 行）' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 /tmp/e2e.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # 千局模拟独立跑（约 1.5–2 小时），不阻塞 Pages 部署
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: AI vs AI 千局模拟
        run: npm run test:sim 2>&1 | tee /tmp/sim.log; exit ${PIPESTATUS[0]}
        timeout-minutes: 180
      - name: 模拟失败摘要
        if: failure()
        run: |
          echo '## 模拟输出（末 40 行）' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 /tmp/sim.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: 构建（Pages 子路径）
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
